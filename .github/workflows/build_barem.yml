name: Owner-requested barem build (Peppa 17/28)
on:
  push:
    branches: [main]
    paths:
      - 'barem-requests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kids-barem-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'mstrangtrieueducation-droid/kids-grader-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Validate the builder without secrets
        run: |
          node hosted-bootstrap.mjs
          node barem-builder-tests.mjs
      - name: Inspect or build inside the trusted runner
        env:
          BAREM_BUILDER_RUN: '1'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PRIVATE_BUNDLE_KEY: ${{ secrets.PRIVATE_BUNDLE_KEY }}
        run: node barem-builder.mjs
