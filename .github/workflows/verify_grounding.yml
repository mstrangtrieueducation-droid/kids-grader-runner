name: Verify screen-first grading
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screen-grounding-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify frozen code and screen grounding without credentials
        run: |
          node hosted-bootstrap.mjs
          node screen-grounding-tests.mjs
          node --input-type=module -e "import fs from 'node:fs';import {execFileSync} from 'node:child_process';for(const f of fs.readdirSync('.').filter(f=>f.endsWith('.mjs')))execFileSync(process.execPath,['--check',f],{stdio:'inherit'});"
