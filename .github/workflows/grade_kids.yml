name: Grade KIDS Pipeline
run-name: KIDS grading enabled=${{ vars.GRADING_ENABLED }} mode=${{ inputs.mode || 'grade' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate, read private queues, or grade eligible submissions
        type: choice
        options: [validate, audit, grade]
        default: grade
permissions:
  contents: read
concurrency:
  group: kids-single-writer
  cancel-in-progress: false
jobs:
  grade:
    if: github.repository == 'mstrangtrieueducation-droid/kids-grader-runner' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.mode == 'validate' || inputs.mode == 'audit' || vars.GRADING_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MODE: ${{ inputs.mode || 'grade' }}
      GRADING_ENABLED: ${{ vars.GRADING_ENABLED }}
      KIDS_PRIORITY_JOB_ID: ${{ vars.KIDS_PRIORITY_JOB_ID || '' }}
      RUNNER_API_LIMIT: ${{ vars.RUNNER_API_LIMIT || '16' }}
      RUNNER_VERIFY_NEW_MODEL: ${{ vars.RUNNER_VERIFY_NEW_MODEL || 'false' }}
      MODEL_GRADING_AVAILABLE: ${{ vars.MODEL_GRADING_AVAILABLE || 'true' }}
      RUNNER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Validate without access to credentials
        if: env.MODE == 'validate'
        run: node run-lane.mjs
      - name: Install official media tools
        if: env.MODE != 'validate'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq || echo 'Package refresh deferred; using available indexes'
            timeout 240s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version >/dev/null
          python3 -m pip install --quiet -r requirements.txt
      - name: Validate, audit or grade this lane
        env:
          GEMINI_KEY_KIDS: ${{ secrets.GEMINI_KEY_KIDS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PRIVATE_BUNDLE_KEY: ${{ secrets.PRIVATE_BUNDLE_KEY }}
        run: node run-lane.mjs
