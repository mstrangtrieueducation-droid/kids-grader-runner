name: Grade KIDS Pipeline
run-name: KIDS grading enabled=${{ vars.GRADING_ENABLED }} mode=${{ inputs.mode || 'grade' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate, read private queues, or grade eligible submissions
        type: choice
        options: [validate, audit, grade]
        default: grade
permissions:
  contents: read
  actions: read
concurrency:
  group: kids-single-writer
  cancel-in-progress: false
jobs:
  grade:
    if: github.repository == 'mstrangtrieueducation-droid/kids-grader-runner' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.mode == 'validate' || inputs.mode == 'audit' || vars.GRADING_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MODE: ${{ inputs.mode || 'grade' }}
      GRADING_ENABLED: ${{ vars.GRADING_ENABLED }}
      KIDS_PRIORITY_JOB_ID: ${{ vars.KIDS_PRIORITY_JOB_ID || '' }}
      RUNNER_API_LIMIT: ${{ vars.RUNNER_API_LIMIT || '16' }}
      RUNNER_VERIFY_NEW_MODEL: ${{ vars.RUNNER_VERIFY_NEW_MODEL || 'false' }}
      MODEL_GRADING_AVAILABLE: ${{ vars.MODEL_GRADING_AVAILABLE || 'true' }}
      RUNNER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUNNER_GITHUB_TOKEN: ${{ github.token }}
      GOOGLE_SHEETS_INTERVAL_MS: '3500'
      GOOGLE_RATE_GATE_FILE: .runtime/google-rate.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Validate without access to credentials
        if: env.MODE == 'validate'
        run: node run-lane.mjs
      - name: Validate teacher master policy without provider calls
        run: |
          node master-compact-output-tests.mjs
          node completed-lease-owner-tests.mjs
      - name: Install official media tools
        if: env.MODE != 'validate'
        run: |
          python3 -m pip install --quiet --timeout 30 --retries 2 -r requirements.txt
          if ! command -v ffmpeg >/dev/null 2>&1 || ! ffmpeg -version >/dev/null 2>&1; then
            python3 -m pip install --quiet --timeout 30 --retries 2 'imageio-ffmpeg==0.6.0'
            media_bin="$RUNNER_TEMP/teacher-media-tools"
            mkdir -p "$media_bin"
            ffmpeg_exe=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            ln -sf "$ffmpeg_exe" "$media_bin/ffmpeg"
            "$media_bin/ffmpeg" -version >/dev/null
            echo "$media_bin" >> "$GITHUB_PATH"
            echo "FFMPEG_PATH=$media_bin/ffmpeg" >> "$GITHUB_ENV"
          fi
      - name: Validate, audit or grade this lane
        env:
          GEMINI_KEY_KIDS: ${{ secrets.GEMINI_KEY_KIDS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PRIVATE_BUNDLE_KEY: ${{ secrets.PRIVATE_BUNDLE_KEY }}
        run: node run-lane.mjs
